# Trust boundary for golden orientation of the clebsch support cubic: formal boundary.

schema_version = 1
area = "clebsch_support_cubic_orientation"
manifest = "trust/CLEBSCH_SUPPORT_CUBIC_ORIENTATION.md"

owns = [
  "RelativeConicArcs.ClebschGoldenConference",
  "RelativeConicArcs.ClebschTwoGraph",
  "RelativeConicArcs.GoldenCubicNodeElimination",
  "RelativeConicArcs.GoldenCubicNodeHessians",

expected_axioms = ["Classical.choice", "Quot.sound", "propext"]

[[terminal]]
declaration = "RelativeConicArcs.SixArcOneFactorization.card_filter_mem_nonconcurrentMatchings"
gates = ["RelativeConicArcs.SixArcConcurrenceSpine"]
